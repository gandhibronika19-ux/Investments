<style>
/* Rupee Ledger styles. Colours and fonts are the tokens at the top of :root — change them there. */
/* Layout: bright ledger workspace — white rail and cards on a cool daylight ground, one vivid
   rupee-blue block for net worth; on phones the rail becomes an app-style bottom tab bar. */
:root {
  --bg: #FAFCFF; --surface: #FFFFFF; --surface-2: #F4F7FC; --ink: #16233A; --muted: #66768C; --line: #EBF0F7; --line-2: #DCE4EF;
  --accent: #3B63F3; --accent-2: #2B50DC; --accent-ink: #FFFFFF; --accent-soft: #EEF3FF;
  --gain: #0E9F6E; --gain-soft: #E3F8EF; --loss: #E5484D; --loss-soft: #FFECEC; --warn: #C27803; --warn-soft: #FFF5DB;
  --c1: #2F54EB; --c2: #0E9F6E; --c3: #F59E0B; --c4: #8B5CF6; --c5: #06B6D4; --c6: #F43F5E; --c7: #84CC16; --c8: #94A3B8;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-num: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 16px; --shadow: 0 1px 2px rgba(22, 35, 58, .03), 0 4px 16px rgba(59, 99, 243, .05); --shadow-lg: 0 10px 40px rgba(15, 27, 45, .14);
  --hero-ink: #16233A; --hero-soft: #5A6B85; --hero-bg-1: #EEF4FF; --hero-bg-2: #E2F6F0; --hero-line: rgba(59, 99, 243, .045);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1220; --surface: #121B2C; --surface-2: #18233A; --ink: #EAF0FA; --muted: #9AA9C0; --line: #22304A; --line-2: #2C3C5A;
  --accent: #6E8BFF; --accent-2: #3E5EF0; --accent-ink: #0B1220; --accent-soft: #1A2650;
  --gain: #34D399; --gain-soft: #0F2F27; --loss: #FB7185; --loss-soft: #3A1A22; --warn: #FBBF24; --warn-soft: #33270C;
  --c1: #6E8BFF; --c2: #34D399; --c3: #FBBF24; --c4: #A78BFA; --c5: #22D3EE; --c6: #FB7185; --c7: #A3E635; --c8: #94A3B8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --hero-ink: #EAF0FA; --hero-soft: #9AA9C0; --hero-bg-1: #1A2650; --hero-bg-2: #12302A; --hero-line: rgba(255, 255, 255, .04); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #121B2C; --surface-2: #18233A; --ink: #EAF0FA; --muted: #9AA9C0; --line: #22304A; --line-2: #2C3C5A;
  --accent: #6E8BFF; --accent-2: #3E5EF0; --accent-ink: #0B1220; --accent-soft: #1A2650;
  --gain: #34D399; --gain-soft: #0F2F27; --loss: #FB7185; --loss-soft: #3A1A22; --warn: #FBBF24; --warn-soft: #33270C;
  --c1: #6E8BFF; --c2: #34D399; --c3: #FBBF24; --c4: #A78BFA; --c5: #22D3EE; --c6: #FB7185; --c7: #A3E635; --c8: #94A3B8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --hero-ink: #EAF0FA; --hero-soft: #9AA9C0; --hero-bg-1: #1A2650; --hero-bg-2: #12302A; --hero-line: rgba(255, 255, 255, .04); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, td.n, th.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
code { font-family: var(--f-mono); font-size: .92em; }

/* shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding-block: 20px; }
.brand { padding: 0 20px 20px; display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #4D74FF, #2B50DC); color: #fff; display: grid; place-items: center; font: 700 20px/1 var(--f-display); box-shadow: 0 4px 12px rgba(47, 84, 235, .35); flex: none; }
.brand b { font: 700 19px/1.1 var(--f-display); letter-spacing: -.015em; white-space: nowrap; display: block; }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; overflow-y: auto; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-weight: 500; transition: background .15s, color .15s; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav .more { display: none; }
.rail-foot { margin-top: auto; padding: 14px 20px 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.main { min-width: 0; padding-inline: 32px; padding-block: 0 56px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-block: 18px 14px; margin-bottom: 18px; }
.top h1 { font: 700 27px/1.15 var(--f-display); letter-spacing: -.02em; margin: 0; margin-right: auto; text-wrap: balance; }
.status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--gain); display: inline-block; box-shadow: 0 0 0 3px var(--gain-soft); }
.status.saving i { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); } .status.err i, .status.local i { background: var(--loss); box-shadow: 0 0 0 3px var(--loss-soft); }
.ctl { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* controls */
select, input[type=text], input[type=number], input[type=date], input[type=month], input[type=search], textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; min-height: 40px; max-width: 100%; }
textarea { min-height: 72px; width: 100%; }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { cursor: pointer; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 14px; min-height: 40px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: transform .1s, box-shadow .15s, background .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(47, 84, 235, .28); }
.btn.primary:hover { background: var(--accent-2); color: #fff; }
.btn.danger { color: var(--loss); } .btn.danger:hover { border-color: var(--loss); }
.btn.sm { min-height: 32px; padding: 4px 11px; font-size: 13px; border-radius: 9px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); box-shadow: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); margin-bottom: 18px; }
.banner b { color: var(--warn); }
.banner.info { background: var(--accent-soft); } .banner.info b { color: var(--accent); }

/* KPI tiles */
.grid { display: grid; gap: 14px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-bottom: 22px; }
.kpi { all: unset; box-sizing: border-box; position: relative; background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; box-shadow: var(--shadow); border: 1px solid var(--line); transition: transform .15s, box-shadow .15s, border-color .15s; }
.kpi[data-go]::after { content: '›'; position: absolute; top: 12px; right: 14px; color: var(--line-2); font-size: 18px; line-height: 1; transition: color .15s, transform .15s; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent-soft); }
.kpi:hover::after { color: var(--accent); transform: translateX(2px); }
.kpi:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 500; padding-right: 14px; }
.kpi .v { font: 600 21px/1.2 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.hero { grid-column: span 2; grid-row: span 2; justify-content: flex-end; padding: 22px 24px; color: var(--hero-ink); border: 0;
  background: repeating-linear-gradient(0deg, var(--hero-line) 0 1px, transparent 1px 22px), linear-gradient(135deg, var(--hero-bg-1) 0%, #F6F9FF 55%, var(--hero-bg-2) 100%);
  border: 1px solid var(--line); box-shadow: var(--shadow); }
.kpi.hero::before { content: '₹'; position: absolute; right: 18px; top: 4px; font: 700 120px/1 var(--f-display); color: rgba(59, 99, 243, .08); pointer-events: none; }
.kpi.hero::after { color: var(--accent); opacity: .5; }
.kpi.hero .l, .kpi.hero .s { color: var(--hero-soft); }
.kpi.hero .v { font: 700 42px/1.05 var(--f-display); letter-spacing: -.025em; color: var(--ink); }
.kpi.hero .pos, .kpi.hero .neg { padding: 1px 8px; border-radius: 99px; font-weight: 600; } .kpi.hero .pos { background: var(--gain-soft); } .kpi.hero .neg { background: var(--loss-soft); }
.pos { color: var(--gain); } .neg { color: var(--loss); } .mut { color: var(--muted); } .wrn { color: var(--warn); }

/* panels */
.cols { display: grid; gap: 18px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; } .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; box-shadow: var(--shadow); }
.panel h2 { font: 700 17px/1.25 var(--f-display); margin: 0 0 4px; letter-spacing: -.01em; }
.panel h3 { font-size: 12px; font-weight: 600; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.ph p { margin: 0; color: var(--muted); font-size: 13px; max-width: 68ch; }
.chart { position: relative; height: 270px; }
.chart.sm { height: 210px; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; letter-spacing: .01em; }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--accent); }
td.n, th.n { text-align: right; white-space: nowrap; }
td:first-child { white-space: nowrap; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.click { cursor: pointer; }
tr.tot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line-2); }
tr.sub td { font-weight: 600; }
tr.muted td { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.good { background: var(--gain-soft); color: var(--gain); } .chip.bad { background: var(--loss-soft); color: var(--loss); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.acc { background: var(--accent-soft); color: var(--accent); }

/* tabs */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; overflow-x: auto; max-width: 100%; box-shadow: var(--shadow); }
.tabs button { all: unset; cursor: pointer; padding: 7px 14px; color: var(--muted); font-weight: 600; font-size: 13.5px; border-radius: 9px; white-space: nowrap; transition: background .15s, color .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }

/* insights */
.insights { display: flex; flex-direction: column; gap: 8px; }
.ins { all: unset; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); transition: background .15s; }
.ins:hover { background: var(--accent-soft); }
.ins .bar { width: 30px; height: 30px; border-radius: 9px; background: var(--muted); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
.ins .bar::before { content: 'i'; }
.ins.good .bar { background: var(--gain); } .ins.good .bar::before { content: '✓'; }
.ins.warn .bar { background: var(--warn); } .ins.warn .bar::before { content: '!'; }
.ins.alert .bar { background: var(--loss); } .ins.alert .bar::before { content: '!'; }
.ins.info .bar { background: var(--accent); }
.ins b { font-weight: 600; display: block; }
.ins span { color: var(--muted); font-size: 13px; }
.ins:focus-visible { outline: 2px solid var(--accent); }

.dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 13.5px; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; }
.dl.wide { grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 8px 16px; }
.dl.wide dd { text-align: left; font-family: var(--f-body); font-weight: 400; }
.dl .t { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; color: var(--ink); }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--c5)); border-radius: 99px; }
.bar-fill.good { background: linear-gradient(90deg, var(--gain), var(--c7)); } .bar-fill.warn { background: linear-gradient(90deg, var(--warn), var(--c3)); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-weight: 600; font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
.note { font-size: 13px; color: var(--muted); max-width: 75ch; }
.mt { margin-top: 16px; } .mb { margin-bottom: 16px; }

/* dialogs */
dialog { border: 0; border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow-lg); }
dialog::backdrop { background: rgba(10, 18, 34, .45); backdrop-filter: blur(3px); }
.dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-h h2 { font: 700 19px var(--f-display); margin: 0; letter-spacing: -.01em; }
.dlg-b { padding: 18px 20px; overflow-y: auto; }
.dlg-f { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.dlg-f .left { margin-right: auto; }
.form { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.form label.wide { grid-column: 1 / -1; }
.form label.chk { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; }
.form input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.form .help { font-weight: 400; font-size: 11.5px; }
.form input, .form select { width: 100%; }
.errs { color: var(--loss); background: var(--loss-soft); padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 13.5px; font-weight: 500; z-index: 50; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.split { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.regime { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.regime.best { border-color: var(--gain); box-shadow: 0 0 0 3px var(--gain-soft), var(--shadow); }
.big { font: 700 30px/1.1 var(--f-display); letter-spacing: -.02em; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 4px 12px; align-items: center; font-size: 13.5px; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); }
.loading { padding: 80px 20px; text-align: center; color: var(--muted); }

@media (max-width: 1100px) { .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; } }
/* phones: bottom tab bar */
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: auto; left: 0; right: 0; bottom: 0; height: auto; z-index: 20; flex-direction: row; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -6px 24px rgba(15, 27, 45, .06); }
  .brand, .rail-foot { display: none; }
  .nav { flex-direction: row; justify-content: space-around; width: 100%; padding: 0; overflow: visible; gap: 0; }
  .nav button { flex-direction: column; gap: 3px; padding: 6px 4px; font-size: 11px; flex: 1 1 0; text-align: center; justify-content: center; border-radius: 12px; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button[aria-current="page"] { background: transparent; color: var(--accent); box-shadow: none; }
  .nav button[aria-current="page"] svg { background: var(--accent-soft); border-radius: 10px; padding: 3px; width: 34px; height: 28px; }
  .nav button.extra { display: none; }
  .nav .more { display: flex; }
  .main { padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  .top { padding-block: 14px 10px; }
  .top h1 { font-size: 24px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 13px 14px; }
  .kpi .v { font-size: 17px; }
  .kpi.hero { grid-column: span 2; grid-row: auto; padding: 20px; }
  .kpi.hero .v { font-size: 34px; }
  .panel { padding: 16px; }

    { empty: 'Nothing due in the next 90 days.', onRow: (r) => { const [v, t] = r.go.split('|'); go(v, t); } });
}

    onSave: (v) => { const calc = WE.accountBalances(S, v.date)[v.accountId] || 0; const diff = v.actual - calc; if (!diff) { toast('Already matches — no adjustment needed'); return; } upsert('txns', { date: v.date, type: 'adjustment', accountId: v.accountId, amount: diff, desc: `Reconciliation to bank balance ${money(v.actual)} (was ${money(calc)})`, source: 'reconcile' }); toast(`Adjustment of ${money(diff, { sign: true })} recorded`); } });
  void bal;
};

<script>
/* ───────────── TRADING ───────────── */
V.trading = () => {
  const t = tabs('trading', [['pnl', 'P&L'], ['positions', 'Open positions'], ['trades', 'Trade book']]);
  const p = period(); const st = WE.foStats(S, p.from, p.to);
  const cap = S.settings.tradingCapital || WE.sum(S.accounts.filter((a) => a.type === 'trading'), (a) => WE.accountBalances(S, p.from)[a.id] || 0);
  const lim = S.settings.thresholds?.foMonthlyLossLimit || 0;
  let body = '', after = null;
  if (t.cur === 'pnl') {
    const months = Object.entries(st.byMonth).sort();
    body = `<div class="kpis">${kpi('Net P&L', mc(st.net), `${esc(p.label)} · after charges`, null, 'hero')}${kpi('Gross P&L', mc(st.gross))}${kpi('Charges & taxes', money(st.charges), st.gross ? `${pct(Math.abs(st.charges / st.gross), 0)} of gross` : '')}${kpi('Win rate', st.winRate == null ? '—' : pct(st.winRate, 0), `${st.wins} won · ${st.losses} lost`)}
      ${kpi('Average win', mc(st.avgWin))}${kpi('Average loss', mc(st.avgLoss))}${kpi('Largest win', mc(st.largestWin))}${kpi('Largest loss', mc(st.largestLoss))}${kpi('Max drawdown', mc(st.maxDrawdown), 'Peak-to-trough on realised P&L')}${kpi('Return on capital', cap ? pctc(st.net / cap) : '—', cap ? `On ${money(cap, { compact: true })} capital` : 'Set trading capital in Settings')}</div>
    <div class="cols">${panel('Monthly net P&L', lim ? `Dashed line: your monthly loss limit (${money(-lim)})` : 'Set a monthly loss limit in Settings to get alerts', '<div class="chart"><canvas id="foM"></canvas></div>', '', 'span-7')}
    ${panel('Charges breakdown', esc(p.label), `<dl class="dl"><dt>Brokerage</dt><dd>${money(st.chargeBreakdown.brokerage)}</dd><dt>STT</dt><dd>${money(st.chargeBreakdown.stt)}</dd><dt>Exchange transaction charges</dt><dd>${money(st.chargeBreakdown.exchange)}</dd><dt>GST</dt><dd>${money(st.chargeBreakdown.gst)}</dd><dt>SEBI fees</dt><dd>${money(st.chargeBreakdown.sebi)}</dd><dt>Stamp duty</dt><dd>${money(st.chargeBreakdown.stamp)}</dd><dt class="t">Total</dt><dd class="t">${money(st.charges)}</dd></dl>
      <h3>Tax treatment</h3><p class="note">F&O is treated as non-speculative business income (ITR-3). Charges, including STT, are deducted as business expenses. A net loss can be set off against other income except salary and carried forward 8 years. Turnover (sum of absolute profits) this period: <b class="num">${money(st.turnover)}</b> — check tax-audit applicability with a CA.</p>`, '', 'span-5')}
    ${panel('Cumulative realised P&L', 'Net of charges, by trading day', '<div class="chart sm"><canvas id="foC"></canvas></div>', '', 'span-12')}</div>`;
    after = () => { const P = PAL();
      chart('foM', { type: 'bar', data: { labels: months.map(([m]) => fmtM(m)), datasets: [{ label: 'Net P&L', data: months.map(([, v]) => v), backgroundColor: months.map(([, v]) => (v >= 0 ? cssv('--gain') : cssv('--loss'))) }, ...(lim ? [{ type: 'line', label: 'Loss limit', data: months.map(() => -lim), borderColor: cssv('--warn'), borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5 }] : [])] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tipMoney }, scales: { y: axisMoney, x: { grid: { display: false } } } } });
      chart('foC', { type: 'line', data: { labels: st.series.map((s) => fmtD(s.date)), datasets: [{ label: 'Cumulative', data: st.series.map((s) => s.cum), borderColor: P[0], backgroundColor: cssv('--accent-soft'), fill: true, tension: .2, pointRadius: 2 }] }, options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tipMoney }, scales: { y: axisMoney, x: { grid: { display: false } } } } }); };
  }
  if (t.cur === 'positions') {
    const pos = WE.foBook(S, TODAY).positions;
    body = panel('Open positions', 'Not realised. Long options count as an asset at mark; short options as a liability at mark (premium was received in cash); futures as mark-to-market. Update marks to revalue.', table('pos', [
      { h: 'Contract', v: (r) => `${esc(r.key)}${r.expiredUnsettled ? ' <span class="chip bad">Expired — record settlement</span>' : ''}` }, { h: 'Side', v: (r) => (r.dir > 0 ? '<span class="chip good">Long</span>' : '<span class="chip bad">Short</span>') }, { h: 'Qty', v: (r) => r.qty, n: true }, { h: 'Entry', v: (r) => r.entry, n: true },
      { h: 'Mark', v: (r) => (r.noMark ? '<span class="chip warn">No mark</span>' : `${r.mark} <span class="mut" style="font-size:11px">${fmtD(r.markDate)}</span>`), n: true }, { h: 'Unrealised', v: (r) => mc(r.unrealized), n: true }, { h: 'Expiry', v: (r) => fmtD(r.expiry) }, { h: '', v: (r) => btn('Update mark', 'mark', r.key) }], pos,
      { empty: 'No open positions.' }), btn('Add trade', 'addTrade', null, 'primary'));
  }
  if (t.cur === 'trades') {
    const tr = S.foTrades.filter((x) => WE.inRange(x.date, p.from, p.to)).sort((a, b) => (a.date < b.date ? 1 : -1));
    body = panel('Trade book', `${esc(p.label)} · ${tr.length} trades. Charges marked "est." were estimated from the rate table; replace them with contract-note figures.`, table('trades', [
      { h: 'Date', v: (r) => fmtD(r.date), s: (r) => r.date }, { h: 'Contract', v: (r) => esc(WE.contractKey(r)) }, { h: 'Side', v: (r) => `<span class="chip ${r.side === 'BUY' ? 'good' : 'bad'}">${r.side}</span>` }, { h: 'Qty', v: (r) => r.qty, n: true }, { h: 'Price', v: (r) => r.price, n: true },
      { h: 'Value', v: (r) => mn(Math.round(r.qty * r.price * 100)), n: true }, { h: 'Charges', v: (r) => `${mn(WE.tradeCharges(r))}${r.chargesEstimated || r.source === 'sample' ? ' <span class="chip">est.</span>' : ''}`, n: true }, { h: 'Account', v: (r) => esc(accName(r.accountId)) }], tr,
      { empty: emptyState('No trades in this period', 'Add trades by hand or import your broker’s tradebook CSV.'), onRow: (r) => editTrade(r) }), `${btn('Add trade', 'addTrade', null, 'primary')}${btn('Import tradebook CSV', 'import', 'foTrades')}`);
  }
  return { html: t.html + body, after };
};
ACTIONS.addTrade = () => editTrade();
ACTIONS.mark = (k) => editMark(k);

/* ───────────── TAX CENTRE ───────────── */
V.tax = () => {
  const t = tabs('tax', [['calc', 'Estimate & compare'], ['plan', 'Scenario planner'], ['pay', 'TDS & payments'], ['rules', 'Rules & assumptions']]);
  const fy = UI.taxFy; const cur = WE.fyStartYear(TODAY); const isCur = fy === cur;
  const regime = UI.taxRegime || S.settings.regime || 'new';
  const ti = WE.buildTaxInput(S, fy, { asOf: TODAY, project: isCur && UI.project });
  const cmp = WE.compareRegimes(ti);
  const head = `<div class="row mb"><label class="mut" for="taxFySel" style="font-size:12px">Financial year</label><select id="taxFySel" data-ui="taxFy">${fyOpts().map(([v, l]) => `<option value="${v}" ${v === fy ? 'selected' : ''}>${l} (AY ${WE.ayLabel(v)})</option>`).join('')}</select>
    <select data-ui="taxRegime" aria-label="Regime"><option value="new" ${regime === 'new' ? 'selected' : ''}>New regime (default)</option><option value="old" ${regime === 'old' ? 'selected' : ''}>Old regime</option></select>
    ${isCur ? `<label class="row" style="font-size:13px"><input type="checkbox" data-ui="project" ${UI.project ? 'checked' : ''}> Project the full year</label>` : ''}${btn('Edit deductions', 'deductions', fy)}</div>`;
  if (cmp.error) return { html: t.html + head + `<div class="banner"><span><b>No tax rules for FY ${WE.fyLabel(fy)}.</b> ${esc(cmp.error)} Rules are added only from verified official sources; nothing is guessed.</span></div>` };
  const sel = cmp[regime];
  let body = '';
  if (t.cur === 'calc') {
    const card = (r, name) => `<div class="regime ${cmp.better === name ? 'best' : ''}"><div class="row sp"><b>${name === 'new' ? 'New regime' : 'Old regime'}</b>${cmp.better === name ? '<span class="chip good">Lower tax</span>' : ''}</div><div class="big num" style="margin:8px 0">${money(r.total)}</div>
      <dl class="dl"><dt>Taxable income</dt><dd>${money(r.taxable)}</dd><dt>Deductions & exemptions used</dt><dd>${money(r.totalDeductions + r.hraExemption)}</dd><dt>Effective rate on gross income</dt><dd>${pct(r.effectiveRate)}</dd><dt>TDS + advance + self-assessment</dt><dd>${money(r.paid)}</dd><dt class="t">${r.balance >= 0 ? 'Still payable' : 'Refund due'}</dt><dd class="t ${r.balance >= 0 ? 'neg' : 'pos'}">${money(Math.abs(r.balance))}</dd></dl></div>`;
    const why = cmp.saving === 0 ? 'Both regimes give the same estimate.' : cmp.better === 'new'
      ? `The new regime is ${money(cmp.saving)} lower: its wider slabs and ₹75,000 standard deduction outweigh the ${money(cmp.old.totalDeductions + cmp.old.hraExemption)} of deductions and exemptions you could claim under the old regime.`
      : `The old regime is ${money(cmp.saving)} lower because your deductions and exemptions (${money(cmp.old.totalDeductions + cmp.old.hraExemption)}) are large enough to beat the new regime’s lower rates.`;
    body = `<div class="split mb">${card(cmp.new, 'new')}${card(cmp.old, 'old')}</div><p class="note mb">${why} Salaried taxpayers can usually choose either regime each year when filing.</p>
    <div class="cols">${panel(`Computation — ${regime === 'new' ? 'new' : 'old'} regime`, `${esc(sel.rulesLabel)} · capital gains, F&O business income, perquisites and other income are kept in their own heads and rates.`,
      table('taxc', [{ h: 'Item', v: (l) => esc(l.label) }, { h: '₹', v: (l) => (l.kind === 'muted' ? `<span class="mut num">${money(l.amount)}</span>` : mn(l.amount)), n: true }], sel.lines.filter((l) => l.amount !== 0 || l.kind === 'total'), { rowClass: (l) => (l.kind === 'total' ? 'tot' : l.kind === 'sub' ? 'sub' : l.kind === 'muted' ? 'muted' : '') }), '', 'span-7')}
    ${panel('Check before relying on this', 'Flags from your records', `<div class="insights">${[...sel.flags, ...sel.notes].map((f) => `<div class="ins warn" style="cursor:default"><span class="bar"></span><span><span>${esc(f)}</span></span></div>`).join('') || '<p class="note">No flags.</p>'}</div>
      <h3>Assumptions</h3><dl class="dl"><dt>Assessment year</dt><dd>AY ${WE.ayLabel(fy)}</dd><dt>Regime shown</dt><dd>${regime === 'new' ? 'New (s.115BAC)' : 'Old'}</dd><dt>Age band</dt><dd>${esc(S.settings.ageBand || 'below60')}</dd><dt>Rules last updated</dt><dd>${fmtD(WE.TAX_RULES.meta.lastUpdated)}</dd><dt>Interest</dt><dd>Accrual basis</dd><dt>Residential status</dt><dd>Resident</dd></dl>
      <p class="note mt">This is an estimate from the records you have entered, not a final liability. Interest u/s 234A/B/C, grandfathering of pre-2018 equity, house-property income and some special cases are not modelled. Review with a qualified tax professional before filing.</p>`, '', 'span-5')}</div>`;
  }
  if (t.cur === 'plan') {
    const sc = Object.assign({ salaryPct: 0, extra80c: 0, extra80d: 0, extraNps: 0, extraLtcg: 0, extraStcg: 0, foDelta: 0, extraInterest: 0 }, UI.scen);
    const R = (x) => Math.round(x * 100);
    const t2 = JSON.parse(JSON.stringify(ti));
    const f = 1 + sc.salaryPct / 100; t2.salary.gross = Math.round(t2.salary.gross * f); t2.salary.basic = Math.round(t2.salary.basic * f); t2.salary.hra = Math.round(t2.salary.hra * f);
    t2.deductions.c80.other += R(sc.extra80c); t2.deductions.d80 += R(sc.extra80d); t2.deductions.ccd1b += R(sc.extraNps);
    if (sc.extraLtcg) t2.cg.ltcg112A.push({ date: WE.fyRange(fy)[1], gain: R(sc.extraLtcg) }); if (sc.extraStcg) t2.cg.stcg111A.push({ date: WE.fyRange(fy)[1], gain: R(sc.extraStcg) });
    t2.business += R(sc.foDelta); t2.interestDeposits += R(sc.extraInterest);
    const c2 = WE.compareRegimes(t2);
    const sl = (k, label, min, max, step, unit) => `<div class="slider"><label for="sc_${k}">${label}</label><span class="num" style="text-align:right">${unit === '%' ? (sc[k] > 0 ? '+' : '') + sc[k] + '%' : money(R(sc[k]), { sign: true })}</span><input type="range" id="sc_${k}" min="${min}" max="${max}" step="${step}" value="${sc[k]}" data-live="scen.${k}" style="grid-column:1/-1"></div>`;
    const row = (lab, a, b) => `<tr><td>${lab}</td><td class="n">${mn(a)}</td><td class="n">${mn(b)}</td><td class="n">${mc(b - a)}</td></tr>`;
    body = `<div class="cols">${panel('What if…', 'Move the sliders; the baseline is your recorded (and projected) income for the year. Nothing is saved.', `<div class="grid">${sl('salaryPct', 'Salary change', -30, 50, 1, '%')}${sl('extra80c', 'Extra 80C investment (old regime)', 0, 150000, 5000)}${sl('extra80d', 'Extra 80D premium (old regime)', 0, 75000, 2500)}${sl('extraNps', 'Own NPS 80CCD(1B) (old regime)', 0, 50000, 5000)}${sl('extraLtcg', 'Additional equity LTCG this year', 0, 500000, 10000)}${sl('extraStcg', 'Additional equity STCG this year', 0, 500000, 10000)}${sl('foDelta', 'Change in F&O result', -500000, 500000, 10000)}${sl('extraInterest', 'Extra FD/RD interest', 0, 300000, 5000)}</div><div class="row mt">${btn('Reset', 'resetScen')}</div>`, '', 'span-6')}
    ${panel('Result', 'Estimated total tax including cess', `<div class="tw"><table><thead><tr><th></th><th class="n">Baseline</th><th class="n">Scenario</th><th class="n">Change</th></tr></thead><tbody>${row('New regime', cmp.new.total, c2.new.total)}${row('Old regime', cmp.old.total, c2.old.total)}${row(`Payable / (refund) — ${regime}`, cmp[regime].balance, c2[regime].balance)}</tbody></table></div>
      <p class="mt"><b>${c2.better === 'new' ? 'New' : 'Old'} regime</b> is lower in this scenario by <b class="num">${money(c2.saving)}</b>.</p>
      <p class="note">Tip: realising up to ₹1.25 lakh of equity LTCG each year is tax-free under s.112A; the planner shows whether a sale stays inside that limit. Projections are estimates, not advice.</p>`, '', 'span-6')}</div>`;
  }
  if (t.cur === 'pay') {
    const [ff, ft] = WE.fyRange(fy);
    const salTds = WE.sum(S.salary.filter((s) => WE.inRange(s.payDate || WE.monthEnd(s.month + '-01'), ff, ft) && (s.payDate || '') <= TODAY), (s) => s.tds || 0);
    const pays = S.taxPayments.filter((x) => (x.fyFor != null ? x.fyFor === fy : WE.inRange(x.date, ff, ft))).sort((a, b) => (a.date < b.date ? -1 : 1));
    const rows = [['Salary TDS (from salary records)', salTds, 'Form 16 / 26AS'], ['ESOP/RSU perquisite & sale TDS', ti.credits.tdsEsop, 'Equity events'], ['TDS on interest, dividends & fees (ledger)', WE.sum(S.txns.filter((x) => WE.inRange(x.date, ff, ft)), (x) => x.tds || 0) + WE.sum(S.secTxns.filter((x) => WE.inRange(x.date, ff, ft)), (x) => x.tds || 0), 'Transactions'],
      ['TDS entered from 26AS/AIS', WE.sum(pays.filter((x) => x.kind === 'tds'), (x) => x.amount), 'Tax payments'], ['Advance tax', WE.sum(pays.filter((x) => x.kind === 'advance'), (x) => x.amount), 'Challan 280'], ['Self-assessment tax', WE.sum(pays.filter((x) => x.kind === 'self_assessment'), (x) => x.amount), 'Challan 280'], ['Refunds received', -WE.sum(pays.filter((x) => x.kind === 'refund'), (x) => x.amount), 'Bank credit']];
    const recorded = WE.sum(rows, (r) => r[1]);
    const adv = WE.advanceTaxSchedule(Math.max(0, sel.total - sel.tds), fy);
    const advPaid = (d) => WE.sum(pays.filter((x) => x.kind === 'advance' && x.date <= d), (x) => x.amount);
    body = `<div class="kpis">${kpi('Estimated liability', money(sel.total), `${regime} regime${ti.projecting ? ' · projected' : ''}`)}${kpi('Actually recorded so far', money(recorded), 'Payments and deductions dated on or before today')}${kpi('Projected future TDS', money(Math.max(0, sel.paid - recorded)), ti.projecting ? 'From your recurring salary setup' : 'None')}${kpi(sel.balance >= 0 ? 'Remaining payable' : 'Expected refund', money(Math.abs(sel.balance)))}</div>
    <div class="cols">${panel('TDS & tax reconciliation', `FY ${WE.fyLabel(fy)} · compare these totals with your Form 26AS / AIS.`, table('recon', [{ h: 'Source', v: (r) => esc(r[0]) }, { h: 'Where it comes from', v: (r) => `<span class="mut">${esc(r[2])}</span>` }, { h: 'Amount', v: (r) => mn(r[1]), n: true }], rows, { foot: `<tr class="tot"><td>Total recorded</td><td></td><td class="n">${mn(recorded)}</td></tr>` }), '', 'span-7')}
    ${panel('Advance-tax schedule', adv.required ? `Liability after TDS is ${money(sel.total - sel.tds)}, above ₹10,000, so advance tax applies.` : 'Liability after TDS is under ₹10,000; advance tax is not required.', adv.required ? table('adv', [{ h: 'Due', v: (r) => fmtD(r.date) }, { h: 'Cumulative %', v: (r) => r.cumulativePct + '%', n: true }, { h: 'Cumulative due', v: (r) => mn(r.cumulative), n: true }, { h: 'Paid by then', v: (r) => mn(advPaid(r.date)), n: true }, { h: '', v: (r) => (r.date < TODAY ? (advPaid(r.date) >= r.cumulative ? '<span class="chip good">Met</span>' : '<span class="chip bad">Short</span>') : '') }], adv.rows) + '<p class="note mt">Shortfalls attract interest u/s 234B/234C, which this app does not compute.</p>' : '', '', 'span-5')}
    ${panel('Payments & credits', 'Advance tax, self-assessment tax, TDS from 26AS, and refunds', table('pays', [{ h: 'Date', v: (r) => fmtD(r.date) }, { h: 'Type', v: (r) => esc(OPT.taxKind.find((k) => k[0] === r.kind)?.[1] || r.kind) }, { h: 'Source / reference', v: (r) => esc(r.source || r.challan || '') }, { h: 'Amount', v: (r) => mn(r.amount), n: true }, { h: 'Account', v: (r) => esc(r.accountId ? accName(r.accountId) : '—') }], pays,
      { empty: 'No payments recorded for this year.', onRow: (r) => editTaxPayment(r) }), btn('Add payment', 'addTaxPay', null, 'primary'), 'span-12')}</div>`;
  }
  if (t.cur === 'rules') {
    const R = WE.rulesForFY(fy);
    const slabT = (sl) => table('sl' + Math.random().toString(36).slice(2, 6), [{ h: 'Income up to', v: (r) => (r[0] === Infinity ? 'Above' : '₹' + r[0].toLocaleString('en-IN')), n: true }, { h: 'Rate', v: (r) => r[1] + '%', n: true }], sl);
    body = `<div class="cols">${panel(`New regime — ${esc(R.label)}`, `Standard deduction ${money(R.new.stdDeduction)} · rebate u/s 87A up to ${money(R.new.rebate.max)} when total income ≤ ${money(R.new.rebate.limit)} (with marginal relief), not available against special-rate capital gains`, slabT(R.new.slabs.below60), '', 'span-6')}
    ${panel(`Old regime — ${esc(R.label)}`, `Standard deduction ${money(R.old.stdDeduction)} · rebate up to ${money(R.old.rebate.max)} when total income ≤ ${money(R.old.rebate.limit)} · slabs for ${esc(S.settings.ageBand || 'below60')}`, slabT(R.old.slabs[S.settings.ageBand || 'below60']), '', 'span-6')}
    ${panel('Capital gains, surcharge & caps', '', `<dl class="dl wide">${R.cg.map((c, i) => `<dt>${c.from > '2000' ? 'Sales from ' + fmtD(c.from) : 'Sales before ' + fmtD(R.cg[i - 1].from)}</dt><dd>STCG 111A ${c.stcg111A}% · LTCG 112A ${c.ltcg112A}% · other LTCG ${c.ltcgOther}%</dd>`).join('')}<dt>112A annual exemption</dt><dd>${money(R.exemption112A)}</dd><dt>Surcharge bands</dt><dd>10% &gt;₹50L · 15% &gt;₹1Cr · 25% &gt;₹2Cr · 37% &gt;₹5Cr (new regime capped at 25%; 15% cap on 111A/112A)</dd><dt>Health & education cess</dt><dd>${R.cess}%</dd><dt>80C / 80CCD(1B) / 80TTA caps</dt><dd>${money(R.caps.c80)} / ${money(R.caps.ccd1b)} / ${money(R.caps.tta)}</dd><dt>Self-occupied home-loan interest (24b)</dt><dd>${money(R.caps.homeLoanSelf)}</dd><dt>Employer NPS 80CCD(2)</dt><dd>${R.new.ccd2PctOfBasic}% of basic (new) · ${R.old.ccd2PctOfBasic}% (old)</dd><dt>Holding period for LTCG</dt><dd>&gt;12 months listed equity · &gt;24 months others · specified debt always short-term</dd></dl>`, '', 'span-7')}
    ${panel('Sources & updates', `Rules last updated ${fmtD(WE.TAX_RULES.meta.lastUpdated)}`, `<ul class="note">${WE.TAX_RULES.meta.sources.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>${(R.notes || []).map((n) => `<p class="note wrn">${esc(n)}</p>`).join('')}<p class="note">Rules live in a versioned table keyed by financial year, separate from the screens. Years without verified rules show an error rather than reusing another year’s slabs. Configured years: ${Object.keys(WE.TAX_RULES).filter((k) => k !== 'meta').map((k) => 'FY ' + WE.fyLabel(+k)).join(', ')}.</p>`, '', 'span-5')}</div>`;
  }
  return { html: t.html + head + body };
};
ACTIONS.deductions = (fy) => editDeductions(+fy);
ACTIONS.addTaxPay = () => editTaxPayment();
ACTIONS.resetScen = () => { UI.scen = {}; render(); };

/* ───────────── NET WORTH ───────────── */
V.networth = () => {
  const t = tabs('networth', [['sheet', 'Balance sheet'], ['perf', 'Performance'], ['liab', 'Liabilities']]);
  let body = '', after = null;
  if (t.cur === 'sheet') {

/* ───────────── GOALS & PLANNING ───────────── */
V.goals = () => {

  let body = '';
  if (t.cur === 'goals') {
    const gs = S.goals.map((g) => { const cur = WE.goalCurrent(S, g, TODAY); return { g, cur, p: WE.goalProjection({ ...g, current: cur }, TODAY) }; });

      <dl class="dl mt"><dt>Target in today’s ₹</dt><dd>${money(g.target)}</dd><dt>Inflation-adjusted target</dt><dd>${money(p.targetNominal)}</dd><dt>Monthly contribution</dt><dd>${money(g.monthly)}</dd><dt>Projected at target date</dt><dd class="${p.onTrack ? 'pos' : 'neg'}">${money(p.projected)}</dd><dt>Needed per month to reach it</dt><dd>${money(p.required)}</dd><dt>Projected completion</dt><dd>${p.completionDate ? fmtD(p.completionDate) : 'Beyond 60 years'}</dd><dt>Still to go</dt><dd>${money(p.remaining)}</dd></dl>
      <p class="note mt">Assumes ${g.returnPct}% returns and ${g.inflationPct}% inflation. A projection, not a promise.${g.links && g.links.length ? ` Linked: ${g.links.map((l) => esc((WE.snapshot(S, TODAY).items.find((i) => i.module === l.module && i.id === l.id) || {}).name || '?')).join(', ')}.` : ''}</p>
      <div class="row mt">${btn('Edit goal', 'editGoal', g.id)}</div></section>`).join('')}</div>` : emptyState('No goals yet', 'Create a goal and link the holdings that fund it; progress updates with their live value.', btn('Add goal', 'addGoal', null, 'primary'));
    body = `<div class="row mb">${btn('Add goal', 'addGoal', null, 'primary')}</div>` + body;
  }
  if (t.cur === 'lab') {
    const sn = WE.snapshot(S, TODAY);
    const investable = WE.sum(sn.items.filter((i) => !['real_estate', 'vehicle'].includes(i.cls) && i.liquidity !== 'restricted'), (i) => i.value) - WE.sum(sn.liabs.filter((l) => l.type !== 'home'), (l) => l.value);
    const six = WE.periodMetrics(S, WE.addMonths(WE.monthStart(TODAY), -6), WE.addDays(WE.monthStart(TODAY), -1));
    const surplus = Math.max(0, Math.round((six.takeHome + six.otherIncome + six.savingsInterest + six.dividends - six.expenses) / 6));
    const esopV = WE.sum(sn.items.filter((i) => i.cls === 'esop'), (i) => i.value) + sn.unvestedEquity;
    const mfV = WE.sum(sn.items.filter((i) => ['mf', 'etf', 'stock'].includes(i.cls)), (i) => i.value);
    const sc = Object.assign({ salUp: 10, extra: 25000, mfRet: 12, baseRet: 12, esopDrop: 30, foLoss: 25000, foMonths: 6, corpus: 50000000, years: 20, fiExp: (S.settings.monthlyExpenses || 0) / 100 * 12, swr: 4, infl: 6 }, UI.scen);
    const R = (x) => Math.round(x * 100);
    const tx = taxNow(); const marg = marginalRate(tx) || 0.3;
    const salGross = tx.ti.salary.gross; const extraTakeHome = Math.round(salGross * sc.salUp / 100 * (1 - marg) / 12);

    const n = sc.years * 12;
    const base = fv(investable, surplus, sc.baseRet, n);
    const withExtra = fv(investable, surplus + R(sc.extra), sc.baseRet, n);
    const withSal = fv(investable, surplus + extraTakeHome, sc.baseRet, n);
    const mfShare = investable ? mfV / investable : 0; const blended = (r) => sc.baseRet * (1 - mfShare) + r * mfShare;
    const mfLow = fv(investable, surplus, blended(sc.mfRet), n);
    const reqFor = WE.requiredMonthly(R(sc.corpus), investable, sc.baseRet, n);
    const mTo = WE.monthsToTarget(R(sc.corpus), investable, surplus + R(sc.extra), sc.baseRet, 0);
    const fiTarget = R(sc.fiExp) * 100 / sc.swr; const fiM = sc.fiExp ? WE.monthsToTarget(fiTarget, investable, surplus, sc.baseRet, sc.infl) : null;
    const sl = (k, label, min, max, step, fmt) => `<div class="slider"><label for="lab_${k}">${label}</label><span class="num" style="text-align:right">${fmt(sc[k])}</span><input type="range" id="lab_${k}" min="${min}" max="${max}" step="${step}" value="${sc[k]}" data-live="scen.${k}" style="grid-column:1/-1"></div>`;
    const rs = (v) => money(R(v), { compact: true }); const pc = (v) => v + '%'; const yr = (v) => v + ' yrs';
    const when = (m) => (m == null ? 'Not within 60 years' : `${fmtD(WE.addMonths(TODAY, m))} (${(m / 12).toFixed(1)} yrs)`);
    const row = (q, a, note) => `<tr><td>${q}</td><td class="n"><b class="num">${a}</b></td><td class="mut">${note || ''}</td></tr>`;
    body = `<div class="banner info"><span><b>Assumption-based projections.</b> Starting point: investable assets ${money(investable)} (excludes your home, vehicles and unlisted shares) and a monthly surplus of ${money(surplus)} averaged over the last six months. Returns are not guaranteed.</span></div>
    <div class="cols">${panel('Assumptions', '', `<div class="grid">${sl('years', 'Horizon', 1, 40, 1, yr)}${sl('baseRet', 'Expected return on investments', 4, 15, 0.5, pc)}${sl('salUp', 'Salary increase', 0, 50, 1, pc)}${sl('extra', 'Extra monthly investment', 0, 200000, 5000, rs)}${sl('mfRet', 'MF & stock return instead', 0, 18, 0.5, pc)}${sl('esopDrop', 'Fall in ESOP/RSU value', 0, 100, 5, pc)}${sl('foLoss', 'F&O loss per month', 0, 200000, 5000, rs)}${sl('foMonths', 'Months of F&O losses', 0, 24, 1, (v) => v + ' mo')}${sl('corpus', 'Target corpus', 1000000, 200000000, 1000000, rs)}${sl('fiExp', 'Annual spending in retirement (today’s ₹)', 0, 6000000, 60000, rs)}${sl('swr', 'Safe withdrawal rate', 2.5, 6, 0.25, pc)}${sl('infl', 'Inflation', 3, 9, 0.5, pc)}</div><div class="row mt">${btn('Reset', 'resetScen')}</div>`, '', 'span-5')}
    ${panel('Answers', `Over ${sc.years} years at ${sc.baseRet}% unless stated`, `<div class="tw"><table><thead><tr><th>Question</th><th class="n">Answer</th><th>How</th></tr></thead><tbody>
      ${row('Projected investable wealth (current path)', money(Math.round(base), { compact: true }), `${money(surplus, { compact: true })}/month surplus`)}
      ${row(`If salary rises ${sc.salUp}%`, money(Math.round(withSal), { compact: true }), `+${money(extraTakeHome, { compact: true })}/month after ~${Math.round(marg * 100)}% marginal tax, all invested`)}
      ${row(`If you invest ${money(R(sc.extra), { compact: true })} more each month`, money(Math.round(withExtra), { compact: true }), `${mc(Math.round(withExtra - base), { compact: true })} vs current path`)}
      ${row(`If MF & stocks return ${sc.mfRet}%`, money(Math.round(mfLow), { compact: true }), `They are ${pct(mfShare, 0)} of investable assets; blended ${blended(sc.mfRet).toFixed(1)}%`)}
      ${row(`If ESOP/RSU value falls ${sc.esopDrop}%`, mc(-Math.round(esopV * sc.esopDrop / 100), { compact: true }), `Today’s net worth would be ${money(sn.netWorth - Math.round(WE.sum(sn.items.filter((i) => i.cls === 'esop'), (i) => i.value) * sc.esopDrop / 100), { compact: true })}; unvested awards shrink too`)}
      ${row(`If F&O loses ${rs(sc.foLoss)} for ${sc.foMonths} months`, mc(-R(sc.foLoss) * sc.foMonths, { compact: true }), `Before tax set-off; ${pct(R(sc.foLoss) * sc.foMonths / Math.max(1, sn.netWorth), 1)} of net worth`)}
      ${row(`Monthly investment needed for ${rs(sc.corpus)} in ${sc.years} yrs`, money(reqFor), `Nominal target; current surplus ${money(surplus, { compact: true })}`)}
      ${row(`When you reach ${rs(sc.corpus)}`, when(mTo), 'With the extra monthly investment')}
      ${row('Financial independence', sc.fiExp ? when(fiM) : 'Set retirement spending', sc.fiExp ? `Corpus of ${money(fiTarget, { compact: true })} today (${sc.swr}% withdrawal), growing with inflation` : '')}
    </tbody></table></div>`, '', 'span-7')}</div>`;
  }
  return { html: t.html + body };
};

function pickFile(accept, cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(String(r.result), f.name); r.readAsText(f); }; i.click(); }

/* ───────────── CSV IMPORT ───────────── */
const IMPORT = {
  txns: { label: 'bank transactions', fields: [['date', 'Date', true], ['desc', 'Description', false], ['debit', 'Debit / withdrawal', false], ['credit', 'Credit / deposit', false], ['amount', 'Signed amount (instead of debit/credit)', false], ['category', 'Category', false]],
    guess: { date: /date/i, desc: /narr|desc|particular|remark/i, debit: /debit|withdraw|dr\b/i, credit: /credit|deposit|cr\b/i, amount: /^amount$|amt/i, category: /categ/i },
    template: 'Date,Description,Debit,Credit,Category\n2026-10-01,Electricity bill,2450,,Utilities\n2026-10-03,Interest credit,,812,Interest\n' },
  secTxns: { label: 'MF / stock transactions', fields: [['date', 'Date', true], ['scheme', 'Scheme / stock name', true], ['type', 'Type (buy/sell/dividend)', true], ['units', 'Units', false], ['nav', 'NAV / price', false], ['amount', 'Amount', true]],
    guess: { date: /date/i, scheme: /scheme|fund|name|security|stock|symbol/i, type: /type|transaction|action/i, units: /unit|qty|quantity/i, nav: /nav|price|rate/i, amount: /amount|value/i },
    template: 'Date,Scheme,Type,Units,NAV,Amount\n2026-10-06,UTI Nifty 50 Index — Direct Growth,buy,58.123,172.04,10000\n' },
  foTrades: { label: 'F&O trades', fields: [['date', 'Trade date', true], ['symbol', 'Symbol / underlying', true], ['side', 'Side (buy/sell)', true], ['qty', 'Quantity (units)', true], ['price', 'Price', true], ['expiry', 'Expiry date', true], ['strike', 'Strike', false], ['opt', 'Option type (CE/PE, blank = future)', false], ['orderId', 'Trade / order ID', false]],
    guess: { date: /trade.?date|date/i, symbol: /symbol|underlying|instrument/i, side: /side|type|buy.?sell/i, qty: /qty|quantity/i, price: /price|rate/i, expiry: /expiry/i, strike: /strike/i, opt: /option|ce.?pe|opt/i, orderId: /trade.?id|order/i },
    template: 'Trade date,Symbol,Side,Quantity,Price,Expiry,Strike,Option type,Trade ID\n2026-10-07,NIFTY,BUY,65,132.5,2026-10-27,24500,CE,T1001\n' },
};
ACTIONS.template = (k) => exportFile(`template_${k}.csv`, IMPORT[k].template, 'text/csv');
ACTIONS.import = (k) => pickFile('.csv,text/csv', (text, name) => importWizard(k, text, name));
function importWizard(kind, text, file) {
  const rows = WE.parseCSV(text.replace(/^﻿/, '')); if (rows.length < 2) { toast('No data rows in that file'); return; }
  const header = rows[0].map((h) => h.trim()); const data = rows.slice(1);
  const spec = IMPORT[kind]; const map = {};
  for (const [k] of spec.fields) { const i = header.findIndex((h) => spec.guess[k] && spec.guess[k].test(h)); map[k] = i >= 0 && !Object.values(map).includes(i) ? i : -1; }
  const opts = { accountId: kind === 'foTrades' ? (S.accounts.find((a) => a.type === 'trading') || S.accounts[0] || {}).id : (S.accounts[0] || {}).id };
  const draw = () => {
    const parsed = parseImport(kind, data, map, opts);
    const ok = parsed.filter((r) => !r.errors.length && !r.dup); const dups = parsed.filter((r) => r.dup && !r.errors.length); const bad = parsed.filter((r) => r.errors.length);
    openDialog({ title: `Import ${spec.label}`, wide: true,
      body: `<p class="note mb"><b>${esc(file)}</b> · ${data.length} rows. Map each field to a column, check the preview, then import. Duplicates of existing records are skipped automatically.</p>
      <div class="form">${spec.fields.map(([k, l, req]) => `<label>${esc(l)}${req ? ' *' : ''}<select data-map="${k}"><option value="-1">—</option>${header.map((h, i) => `<option value="${i}" ${map[k] === i ? 'selected' : ''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}
      <label>${kind === 'foTrades' ? 'Broker account' : 'Bank account'}<select data-opt="accountId">${S.accounts.map((a) => `<option value="${a.id}" ${opts.accountId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></label></div>
      <div class="row mt mb"><span class="chip good">${ok.length} ready</span><span class="chip warn">${dups.length} duplicates</span><span class="chip bad">${bad.length} with errors</span></div>
      ${table('impPrev', [{ h: '#', v: (r) => r.line, n: true }, { h: 'Status', v: (r) => (r.errors.length ? `<span class="chip bad">${esc(r.errors.join('; '))}</span>` : r.dup ? '<span class="chip warn">Duplicate — skip</span>' : '<span class="chip good">OK</span>') }, { h: 'Parsed', v: (r) => esc(r.summary) }], parsed, { limit: 200 })}`,
      foot: `<button class="btn" data-close type="button">Cancel</button><button class="btn primary" type="button" id="impGo" ${ok.length ? '' : 'disabled'}>Import ${ok.length} row(s)</button>`,
      onMount(d) {
        $$('[data-map]', d).forEach((s) => s.onchange = () => { map[s.dataset.map] = +s.value; draw(); });
        $$('[data-opt]', d).forEach((s) => s.onchange = () => { opts[s.dataset.opt] = s.value; draw(); });
        $('#impGo', d).onclick = () => { d.close(); commitImport(kind, ok, file, dups.length + bad.length); };
      } });
  };
  draw();
}
function parseImport(kind, data, map, opts) {
  const g = (row, k) => (map[k] >= 0 ? (row[map[k]] || '').trim() : '');
  const num = (s) => { const x = parseFloat(String(s).replace(/[₹,\s]/g, '').replace(/^\((.*)\)$/, '-$1')); return isNaN(x) ? null : x; };
  const out = data.map((row, i) => {
    const e = []; const date = WE.normDate(g(row, 'date')); if (!date) e.push('bad date');
    let rec = null, summary = '';
    if (kind === 'txns') {
      let amt = null; if (map.amount >= 0) amt = num(g(row, 'amount')); else { const dr = num(g(row, 'debit')), cr = num(g(row, 'credit')); amt = (cr || 0) - (dr || 0); if (dr == null && cr == null) amt = null; }
      if (amt == null || amt === 0) e.push('no amount');
      const p = WE.toPaise(Math.abs(amt || 0)); const desc = g(row, 'desc');
      const interest = /interest|int\.?\s?cr|int pd/i.test(desc) && amt > 0;
      rec = { date, accountId: opts.accountId, type: amt < 0 ? 'expense' : interest ? 'interest' : 'income', amount: p, desc, category: g(row, 'category') || (amt < 0 ? 'Uncategorised' : ''), source: 'import' };
      summary = `${date} · ${rec.type} · ${money(p)} · ${desc}`;
    }
    if (kind === 'secTxns') {
      const name = g(row, 'scheme'); const sec = S.securities.find((s) => s.name.toLowerCase() === name.toLowerCase()) || S.securities.find((s) => name && s.name.toLowerCase().includes(name.toLowerCase().slice(0, 18)));
      if (!sec) e.push(`unknown holding "${name}" — add it first`);
      const tp = g(row, 'type').toLowerCase(); const k = /sell|redeem|redemption|switch.?out/.test(tp) ? 'sell' : /div|idcw/.test(tp) ? 'dividend' : /buy|purchase|sip|switch.?in/.test(tp) ? 'buy' : null; if (!k) e.push('unknown type');
      const amt = num(g(row, 'amount')); if (amt == null) e.push('no amount'); let units = num(g(row, 'units')); const nav = num(g(row, 'nav'));
      if (k !== 'dividend' && units == null && nav) units = Math.round(Math.abs(amt) / nav * 1000) / 1000; if (k !== 'dividend' && !units) e.push('no units');
      rec = { securityId: sec && sec.id, date, kind: k, units: k === 'dividend' ? 0 : Math.abs(units || 0), amount: WE.toPaise(Math.abs(amt || 0)), nav, accountId: opts.accountId, source: 'import' };
      summary = `${date} · ${k} · ${sec ? sec.name : name} · ${unitsF(units)} u · ${money(rec.amount)}`;
    }
    if (kind === 'foTrades') {
      const sym = g(row, 'symbol').toUpperCase(); const side = /s/i.test(g(row, 'side')[0] || '') ? 'SELL' : /b/i.test(g(row, 'side')[0] || '') ? 'BUY' : null; if (!side) e.push('side?');
      const qty = num(g(row, 'qty')), price = num(g(row, 'price')); const expiry = WE.normDate(g(row, 'expiry')); if (!qty) e.push('qty?'); if (price == null) e.push('price?'); if (!expiry) e.push('expiry?');
      const opt = g(row, 'opt').toUpperCase(); const isOpt = /CE|PE|CALL|PUT/.test(opt);
      rec = { date, underlying: sym, instrument: isOpt ? 'OPT' : 'FUT', optType: isOpt ? (/P/.test(opt) ? 'PE' : 'CE') : '', strike: isOpt ? num(g(row, 'strike')) : '', expiry, side, qty: Math.abs(qty || 0), price, accountId: opts.accountId, orderId: g(row, 'orderId'), source: 'import' };
      Object.assign(rec, WE.estimateCharges(rec)); rec.chargesEstimated = true;
      summary = `${date} · ${side} ${WE.contractKey(rec)} · ${qty} @ ${price}`;
    }
    return { line: i + 2, rec, errors: e, summary };
  });
  const good = out.filter((r) => !r.errors.length);
  const d = WE.findDuplicates(kind, S[kind], good.map((r) => r.rec)); good.forEach((r, i) => { r.dup = d[i].duplicate; });
  return out;
}
function commitImport(kind, rows, file, skipped) {
  const now = new Date().toISOString();
  mutate([kind, 'imports'], () => { for (const r of rows) S[kind].push(Object.assign({ id: WE.uid(kind.slice(0, 3)), createdAt: now, updatedAt: now }, r.rec)); S.imports.push({ id: WE.uid('imp'), date: TODAY, file, target: kind, imported: rows.length, skipped }); for (const r of rows) if (kind === 'secTxns' && r.rec.nav) { const s = S.securities.find((x) => x.id === r.rec.securityId); if (s && !(s.prices || []).some((p) => p.date === r.rec.date)) s.prices = (s.prices || []).concat([{ date: r.rec.date, price: r.rec.nav }]).sort((a, b) => (a.date < b.date ? -1 : 1)); } }, ['import', kind, `${rows.length} rows from ${file}`]);
  if (kind === 'secTxns') dirty.add('securities');
  toast(`Imported ${rows.length} row(s)${skipped ? `, skipped ${skipped}` : ''}`);
}

/* ───────────── THEME & BOOT ───────────── */
(function theme() {
  let t = 'light'; try { t = localStorage.getItem('rl-theme2') || 'light'; } catch (e) { /* storage blocked */ }
  const apply = () => { if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); const b = $('#themeBtn'); if (b) b.textContent = `Theme: ${t}`; };
  apply();
  $('#themeBtn').onclick = () => { t = t === 'light' ? 'dark' : t === 'dark' ? 'system' : 'light'; try { localStorage.setItem('rl-theme2', t); } catch (e) { /* ignore */ } apply(); render(); };
})();
function loginScreen() {
  $('#storeNote').textContent = 'Not signed in';
  $('#main').innerHTML = `<div class="top"><h1>Sign in</h1></div><section class="panel" style="max-width:460px"><h2>Sync your ledger</h2><p class="note mb">This copy is connected to your Supabase project. Enter your email and we’ll send a one-time sign-in link. Your records are readable only by your login.</p>
    <form id="loginForm" class="form" style="grid-template-columns:1fr"><label for="loginEmail">Email<input type="text" inputmode="email" autocomplete="email" id="loginEmail" required></label></form>
    <div class="row mt"><button class="btn primary" type="button" id="loginBtn">Email me a sign-in link</button></div><p class="note mt" id="loginMsg" role="status"></p></section>`;
  const send = async () => { const email = $('#loginEmail').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) { $('#loginMsg').textContent = 'Enter a valid email address.'; return; }
    $('#loginBtn').disabled = true; const { error } = await Store.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    $('#loginBtn').disabled = false; $('#loginMsg').textContent = error ? `Couldn’t send the link: ${error.message}` : `Link sent to ${email}. Open it on this device to finish signing in.`; };
  $('#loginBtn').onclick = send; $('#loginForm').onsubmit = (e) => { e.preventDefault(); send(); };
  Store.sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_IN') location.reload(); });
}
(async function boot() {
  try { const h = (location.hash || '').slice(1); if (NAV.some((n) => n[0] === h)) UI.view = h; } catch (e) { /* ignore */ }
  let loaded = null;
  try { loaded = await Store.init(); } catch (e) { loaded = null; }
  if (Store.mode === 'login') { S = WS.emptyState(); bump(); loginScreen(); return; }
  if (Store.loadFailed) {
    S = WS.emptyState(); bump(); setStatus('err', 'load failed');
    $('#main').innerHTML = `<div class="top"><h1>Couldn’t load your records</h1></div><div class="banner"><span><b>Your saved data could not be read right now.</b> Nothing has been changed or overwritten. Check your connection and try again.</span><button class="btn sm" type="button" data-act="reload">Try again</button></div>`;
    return;
  }
  if (loaded) { S = Object.assign(WS.emptyState(), loaded); S.settings = Object.assign(WS.emptyState().settings, loaded.settings || {}); }
  else { S = WS.buildSample(WE, TODAY); COLLS.forEach((k) => dirty.add(k)); Store.schedule(); }
  bump(); setStatus('ready');
  if (!window.Chart) toast('Charts could not load; figures and tables still work.');
  render();
})();

</script>
